# Lint settings for the Stretch Editor plugin (run: ruff check .)
line-length = 120
target-version = "py37"

[lint]
select = ["E", "W", "F", "I", "B", "UP"]
# B905: zip(strict=) needs Python 3.10; QGIS 3.22 can ship 3.9.
# UP009: keep the plain UTF-8 files without encoding declarations.
ignore = ["B905", "UP009"]

[lint.isort]
known-third-party = ["qgis", "osgeo"]
